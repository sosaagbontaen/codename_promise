[project]
name = "codename-promise-backend"
version = "0.1.0"
description = "Backend for Codename Promise — transcription, formatting, and Notion sync"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
